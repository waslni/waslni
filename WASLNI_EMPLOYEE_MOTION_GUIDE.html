  <script>

      {chapter:'البداية',accent:'var(--violet)',layout:'cover',eyebrow:'فريق يصنع حضورًا يستحق التذكّر',title:'وصلني <span>Waslni</span>',lead:'منصة تساعد الأنشطة التجارية على تنظيم محتواها التسويقي، وتقديم منتجاتها وخدماتها بصورة أكثر احترافية واستمرارية.',micro:'هذه الجولة تعرّفك بفكرتنا، وبالدور الذي يصنعه كل فرد في الفريق.',visual:'cover'},
      {chapter:'ما هي وصلني؟',accent:'var(--cyan)',eyebrow:'الفكرة في جملة',title:'خدمات المحتوى… <span>في فريق واحد</span>',lead:'نربط احتياج النشاط التجاري بخطة محتوى واضحة، ثم نجهّز له موادًا مناسبة بدل أن يبحث عن مصمم وكاتب ومحرر كلٌّ على حدة.',cards:[['🎨','تصميم وإعلانات','صور ترويجية وهوية متناسقة'],['🎬','فيديو قصير','مونتاج يبرز المنتج والفكرة'],['✍️','نصوص تسويقية','عبارات تلائم الجمهور والنشاط'],['🗓️','تنظيم المحتوى','خطة وملفات مرتبة ومواعيد واضحة']],visual:'services'},
      {chapter:'رحلة العمل',accent:'var(--lime)',eyebrow:'كل عمل له مسار مفهوم',title:'من أول سؤال… <span>إلى التسليم</span>',lead:'نحافظ على وضوح المطلوب والمسؤول والمرحلة الحالية، حتى يعرف الفريق والعميل ما أُنجز وما بقي.',steps:[['01','نفهم النشاط','المنتج والجمهور والهدف'],['02','نخطط','المخرجات والموعد والخدمة'],['03','ننتج','تصميم أو فيديو أو نص'],['04','نراجع','الجودة والملاءمة والاعتماد'],['05','نسلّم','أو نُجدول/ننشر عند الاتفاق وتوفر الصلاحية']],visual:'workflow'},
      {chapter:'من نخدم؟',accent:'var(--amber)',eyebrow:'لكل نشاط نبرة مختلفة',title:'محتوى يشبه <span>صاحبَه</span>',lead:'لا نستخدم قالبًا واحدًا للجميع. نفهم طبيعة النشاط وجمهوره، ثم نختار أسلوبًا يخدمه.',cards:[['🌹','الورود والهدايا','مناسبات، ألوان، ومشاعر'],['🧴','العطور والتجميل','تفاصيل المنتج وتجربة الاستخدام'],['☕','المطاعم والمقاهي','المنتج، الأجواء، والعروض'],['👗','الأزياء والمتاجر','التنسيق، القطع، والمواسم'],['📱','الإلكترونيات','الميزة، المقارنة، والاستخدام'],['🏠','المشاريع الصغيرة','قصة صاحب المشروع وقيمته']],visual:'audience'},
      {chapter:'ما الذي يميّزنا؟',accent:'var(--pink)',eyebrow:'معايير نلتزم بها في كل مهمة',title:'الجودة ليست لقطة… <span>بل طريقة عمل</span>',lead:'نقيس نجاحنا بملاءمة المحتوى وجودته وانتظامه، لا بعدد الملفات التي أُنتجت فقط.',steps:[['✦','التنظيم','خطة واضحة بدل النشر العشوائي'],['✦','الجودة','مراجعة التصميم والنص والفيديو'],['✦','فهم العميل','المحتوى يبدأ من طبيعة النشاط'],['✦','الالتزام','تسليم في الموعد وتحديث الحالة'],['✦','التطوير','تحسين العمل وفق الملاحظات والنتائج']],visual:'values'},

      {chapter:'الطلبات والتحويلات',accent:'var(--amber)',eyebrow:'مسار مالي واضح بين العميل والفريق',title:'الطلب يبقى <span>معلّقًا حتى التحقق</span>',lead:'حالة الطلب مرئية للعميل والمدير والموظف. لا تعني رسالة العميل أو صورة الإيصال وحدها أن التحويل تم التحقق منه.',steps:[['01','افتح الطلب','طابق العميل ورقم الطلب والمبلغ'],['02','راجع التحويل','تحقق من اكتمال المبلغ وبيانات الإيصال'],['03','ارفع الإيصال','من إجراء رفع الإيصال في الطلب'],['04','أكد الاستلام','ينتقل الطلب إلى المدير للاعتماد المالي'],['05','تابع الحالة','تتغير لدى الأطراف بعد تحديثها في النظام']],quote:'إذا كان الإيصال ناقصًا أو المبلغ غير مطابق، أوقف الإجراء وارجع للمسؤول. لا تعتمد الدفع من دون تحقق.',visual:'payments'},
      {chapter:'معًا إلى الأمام',accent:'var(--lime)',eyebrow:'الخطوة التالية تبدأ من فهمنا المشترك',title:'نصنع للعميل <span>حضورًا يستمر</span>',lead:'وصلني تجمع التخطيط والتصميم والفيديو والكتابة وتنظيم النشر في تجربة واحدة. ومع نمو احتياج العملاء، تتطور خدماتنا على أساس الجودة والقدرة على الالتزام.',checks:['ساعد العميل على فهم الخطوة التالية بوضوح.','استخدم الأدوات التقنية والذكاء الاصطناعي عند الحاجة، ثم راجع الناتج بنفسك.','وثّق العمل وحدّث حالته ليبقى الفريق على الصورة.','اجعل كل تسليم يعكس التنظيم والذوق والاهتمام.'],micro:'شكرًا لكونك جزءًا من وصلني. كل تفصيل جيد يصنع فرقًا.',visual:'final'}

    const stage=document.getElementById('stage'),chapters=document.getElementById('chapters'),progress=document.getElementById('progress'),counter=document.getElementById('counter'),chapterName=document.getElementById('chapterName'),playBtn=document.getElementById('play'),playIcon=document.getElementById('playIcon'),playLabel=document.getElementById('playLabel'),prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next'),toast=document.getElementById('toast');
    let current=0,timer=null,playing=false;
    const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function cardMarkup(cards){return `<div class="cards">${cards.map(([icon,title,body],i)=>`<article class="info-card" style="--delay:${i*70}ms"><div class="icon">${icon}</div><b>${title}</b><p>${body}</p></article>`).join('')}</div>`}
    function stepsMarkup(steps){return `<div class="sequence">${steps.map(([num,title,body],i)=>`<div class="step-row" style="--delay:${i*65}ms"><span class="step-n">${num}</span><div><b>${title}</b><small>${body}</small></div><span class="step-arrow">←</span></div>`).join('')}</div>`}
    function checksMarkup(checks){return `<div class="checklist">${checks.map((text,i)=>`<div class="check" style="animation:rise .5s ${i*70}ms both"><i>✓</i><span>${text}</span></div>`).join('')}</div>`}
    function visualMarkup(kind,s){
      if(kind==='cover')return `<div class="orbit"></div><div class="orbit o2"></div><div class="orb-core"><span>و</span></div><div class="float-card fc1"><span class="emoji">✦</span><div><strong>فكرة واضحة</strong><small>نبدأ بفهم النشاط</small></div></div><div class="float-card fc2"><span class="emoji">🎨</span><div><strong>محتوى متقن</strong><small>نص · تصميم · فيديو</small></div></div><div class="float-card fc3"><span class="emoji">↗</span><div><strong>حضور مستمر</strong><small>بخطة تناسب العميل</small></div></div>`;

      if(kind==='audience')return `<div class="visual-panel" style="--accent:${s.accent}"><div class="panel-top"><span class="panel-title">النشاط يحدد أسلوب الحكاية</span><span class="panel-badge">لا قوالب مكررة</span></div><div class="mock-list">${[['🌹','الورود','مشاعر ومناسبات'],['🧴','العطور','تفاصيل وتجربة'],['☕','المقاهي','أجواء ومنتج'],['👗','الأزياء','تنسيق ومواسم']].map((x,i)=>`<div class="mock-row" style="--delay:${i*90}ms"><span class="mock-icon">${x[0]}</span><div class="mock-copy"><b>${x[1]}</b><small>${x[2]}</small></div><span class="mock-status">قصة خاصة</span></div>`).join('')}</div></div>`;
      if(kind==='values')return `<div class="visual-panel" style="--accent:${s.accent}"><div class="panel-top"><span class="panel-title">مقياس الجودة قبل التسليم</span><span class="panel-badge">5 نقاط مراجعة</span></div><div class="mock-list">${[['01','واضح','هل الفكرة مفهومة؟'],['02','ملائم','هل يناسب النشاط؟'],['03','متقن','هل راجعنا التفاصيل؟'],['04','منظم','هل الملف والحالة محدثان؟'],['05','معتمد','هل نملك إذن التسليم/النشر؟']].map((x,i)=>`<div class="mock-row" style="--delay:${i*70}ms"><span class="step-n">${x[0]}</span><div class="mock-copy"><b>${x[1]}</b><small>${x[2]}</small></div><span class="mock-status">✓</span></div>`).join('')}</div></div>`;
      if(kind==='team')return `<div class="visual-panel" style="--accent:${s.accent}"><div class="panel-top"><span class="panel-title">طريقة فريق يعتمد عليه</span><span class="panel-badge">من أول مهمة</span></div><div class="route"><div class="route-step"><span class="route-dot">👂</span><b>اسمع</b><small>للاحتياج</small></div><div class="route-step"><span class="route-dot">🗂</span><b>نظّم</b><small>الملفات</small></div><div class="route-step"><span class="route-dot">✦</span><b>أنجز</b><small>بجودة</small></div><div class="route-step"><span class="route-dot">✓</span><b>راجع</b><small>قبل التسليم</small></div><div class="route-step"><span class="route-dot">↻</span><b>حدّث</b><small>الحالة</small></div></div><div class="quote" style="--accent:${s.accent}">الثقة تُبنى من تفاصيل صغيرة: رد واضح، ملف مرتب، وموعد محترم.</div></div>`;
      if(kind==='platform')return `<div class="platform-demo"><div class="demo-head"><span>مساحة عمل وصلني</span><span class="demo-lights"><i></i><i></i><i></i></span></div><div class="demo-content"><div class="demo-welcome"><div><b>مرحبًا بك في مساحة التنفيذ</b><small>الأقسام التي تراها مرتبطة بصلاحياتك</small></div><span class="panel-badge">موظف</span></div><div class="demo-menu"><span class="active">الطلبات والتحويلات</span><span>الباقات</span><span>العملاء</span></div><div class="demo-order"><div class="demo-order-head"><span>طلب #WS-••••••</span><em>بانتظار التحويل</em></div><div class="demo-fields"><div class="demo-field">العميل<b>متجر الورد</b></div><div class="demo-field">الباقة<b>حضور مميز</b></div><div class="demo-field">المطلوب<b>محتوى الشهر</b></div><div class="demo-field">المبلغ<b>يظهر في تفاصيل الطلب</b></div></div><div class="demo-action">افتح التفاصيل ← نفّذ حسب الصلاحية</div></div><div class="demo-caption">محاكاة توضيحية للواجهة — قد تختلف الأقسام حسب صلاحيات الحساب</div></div></div>`;
      if(kind==='payments')return `<div class="visual-panel" style="--accent:${s.accent}"><div class="panel-top"><span class="panel-title">حالة الطلب أمام الجميع</span><span class="panel-badge">مسار موثّق</span></div><div class="mock-list">${[['1','📦','طلب جديد','معلّق بانتظار الدفع'],['2','🧾','رفع الإيصال','الموظف يرفعه بعد التحقق'],['3','🏦','تأكيد الاستلام','يراجعه المدير للاعتماد'],['4','✅','تحديث الحالة','يراها العميل والفريق']].map((x,i)=>`<div class="mock-row" style="--delay:${i*90}ms"><span class="mock-icon">${x[1]}</span><div class="mock-copy"><b>${x[2]}</b><small>${x[3]}</small></div><span class="step-n">${x[0]}</span></div>`).join('')}</div><div class="rulebox">لا تغيّر حالة الدفع بناءً على وعد أو صورة غير واضحة. تحقّق أولًا، ثم وثّق الخطوة في الطلب.</div></div>`;
      return `<div class="orbit"></div><div class="orbit o2"></div><div class="orb-core"><span>✦</span></div><div class="float-card fc1"><span class="emoji">🤝</span><div><strong>فريق واحد</strong><small>هدف مشترك</small></div></div><div class="float-card fc2"><span class="emoji">📈</span><div><strong>تجربة أفضل</strong><small>لكل عميل</small></div></div><div class="float-card fc3"><span class="emoji">💚</span><div><strong>شكرًا لك</strong><small>أنت تصنع الفرق</small></div></div>`;
    }
    function render(){
      const s=slides[current];
      const content=s.cards?cardMarkup(s.cards):s.steps?stepsMarkup(s.steps):s.checks?checksMarkup(s.checks):'';
      stage.innerHTML=`<article class="slide" style="--accent:${s.accent}"><div class="copy"><div class="eyebrow">${s.eyebrow}</div><h${current===0?'1':'2'}>${s.title}</h${current===0?'1':'2'}><p class="lead">${s.lead}</p>${content}${s.quote?`<div class="quote" style="--accent:${s.accent}">${s.quote}</div>`:''}${s.rule?`<div class="rulebox">${s.rule}</div>`:''}${s.micro?`<p class="micro">${s.micro}</p>`:''}${current===0?'<div class="pill"><b></b> جولة قصيرة · 9 محطات · قابلة للإيقاف</div>':''}</div><div class="visual" aria-hidden="true">${visualMarkup(s.visual,s)}</div></article>`;
      counter.textContent=`${String(current+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;
      chapterName.textContent=s.chapter;progress.style.width=`${((current+1)/slides.length)*100}%`;
      [...chapters.children].forEach((b,i)=>b.classList.toggle('active',i===current));
      prevBtn.disabled=current===0;nextBtn.disabled=current===slides.length-1;
    }
    function setPlaying(value){playing=value;playIcon.textContent=playing?'Ⅱ':'▶';playLabel.textContent=playing?'إيقاف مؤقت':current===0?'ابدأ الجولة':'تابع العرض';playBtn.setAttribute('aria-label',playing?'إيقاف العرض مؤقتًا':'تشغيل العرض');clearInterval(timer);if(playing)timer=setInterval(()=>{if(current<slides.length-1)go(current+1);else setPlaying(false)},9000)}
    function go(index){current=Math.max(0,Math.min(slides.length-1,index));render();if(playing){clearInterval(timer);timer=setInterval(()=>{if(current<slides.length-1)go(current+1);else setPlaying(false)},9000)}}
    slides.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='chapter';b.setAttribute('aria-label',`انتقل إلى ${s.chapter}`);b.addEventListener('click',()=>go(i));chapters.appendChild(b)});
    playBtn.addEventListener('click',()=>setPlaying(!playing));prevBtn.addEventListener('click',()=>go(current-1));nextBtn.addEventListener('click',()=>go(current+1));
    document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){go(current+(e.key==='ArrowLeft'?1:-1));}if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();setPlaying(!playing)}});
    render();
  </script>
